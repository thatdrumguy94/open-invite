version: 1.0
runtime: python312
build:
  commands:
    pre-build:
      - pip install --upgrade pip
    build:
      - pip install -r requirements.txt
run:
  command: gunicorn --workers=3 --bind=0.0.0.0:5000 --chdir=src wsgi:app
  network:
    port: 5000
    env: APP_PORT
  env:
    - name: FLASK_ENV
      value: production
    - name: STORAGE_BACKEND
      value: s3
    - name: AWS_REGION
      value: us-east-1
    - name: EMAIL_PROVIDER
      value: ses
