{% extends "base.html" %}

{% block title %}Create Organizer Account{% endblock %}

{% block content %}
<div class="form-card">
  <div style="text-align: center; margin-bottom: 1.5rem;">
    <h2 style="color: var(--color-royal-navy); font-size: 1.75rem; margin-bottom: 0.5rem;">Create Organizer Account</h2>
    <p style="color: #64748B; font-size: 0.95rem;">Set up your host profile to start managing cloud invitations.</p>
  </div>

  <form method="POST" action="{{ url_for('auth.register') }}">
    <div class="form-group">
      <label class="form-label" for="name">Full Name</label>
      <input type="text" id="name" name="name" class="form-control" value="{{ name or '' }}" required autofocus placeholder="Jane Doe">
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input type="email" id="email" name="email" class="form-control" value="{{ email or '' }}" required placeholder="host@example.com">
      <div class="form-help">This email will appear on event communications.</div>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" required placeholder="Minimum 6 characters">
    </div>

    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="Re-enter password">
    </div>

    <div style="margin-top: 1.5rem;">
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Register Account</button>
    </div>
  </form>

  <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #64748B;">
    Already registered? 
    <a href="{{ url_for('auth.login') }}" style="color: var(--color-azure-blue); font-weight: 600;">Sign in here</a>
  </div>
</div>
{% endblock %}
